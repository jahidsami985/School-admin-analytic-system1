{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}
<h2>Students</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Department</th>
    </tr>
    {% for student in data %}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.department.name }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
