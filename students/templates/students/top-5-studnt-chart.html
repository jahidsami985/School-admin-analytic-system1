{% extends "students/chart_base.html" %}
{% load static %}
{% block title %}Top 5 Student Performance{% endblock %}

{% block content %}
<div class="card">
  <h3 class="chart-title">Top 5 Student Performance (with Department)</h3>
  <canvas id="top5Chart" width="400" height="300"></canvas>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
loadDashboardJson("/dashboard-data/")
  .then(data => {
    const top5 = data.top_five_stu || [];
    const labels = top5.map(item => `${item.student__name} (${item.student__department__name || ''})`);
    const marks = top5.map(item => item.total_marks || 0);

    renderBarChart(
      "top5Chart",
      labels,
      marks,
      "Total Marks"
    );
  })
  .catch(err => console.error('Failed to load dashboard.json', err));
</script>
{% endblock %}
