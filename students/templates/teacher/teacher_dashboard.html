{% extends "base.html" %}

{% block title %}Teacher Dashboard{% endblock %}

{% block content %}
<h2>Teacher Dashboard</h2>

<canvas id="avgChart" width="400" height="200"></canvas>

<script>
fetch("/teacher/dashboard/data/{{ teacher_id }}/")
  .then(res => res.json())
  .then(data => {
      const ctx = document.getElementById("avgChart");
      new Chart(ctx, {
          type: "bar",
          data: {
              labels: ["Average Marks"],
              datasets: [{
                  label: "Marks",
                  data: [data.avg_score]
              }]
          }
      });
  });
</script>
{% endblock %}
