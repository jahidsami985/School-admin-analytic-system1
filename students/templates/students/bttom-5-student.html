{% extends "students/chart_base.html" %}
{% load static %}
{% block title %}Bottom 5 Student Performance{% endblock %}

{% block content %}
<div class="card">
  <h3 class="chart-title">Bottom 5 Student Performance</h3>
  <canvas id="bottom5Chart" width="400" height="300"></canvas>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
loadDashboardJson("/dashboard-data/")
  .then(data => {
    const bottom_five = data.bottom_five_stu || [];
    const labels = bottom_five.map(item => item.student__name || '');
    const marks = bottom_five.map(item => item.total_marks || 0);

    renderBarChart(
      "bottom5Chart",
      labels,
      marks,
      "Total Marks"
    );
  })
  .catch(err => console.error('Failed to load dashboard.json', err));
</script>
{% endblock %}
